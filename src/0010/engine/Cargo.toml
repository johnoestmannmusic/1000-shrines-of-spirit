[package]
name = "shrine-0010-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "0010 - the music itself: a deterministic, zero-dependency Glitch Ambient engine (native WAV renderer + WASM player)."
publish = false

# Deliberately zero dependencies: everything (math, RNG, FFT, DSP) is
# implemented here so the track renders bit-identically for decades.
[dependencies]

[lib]
name = "shrine0010"
crate-type = ["rlib", "cdylib"]

# The dependency-free renderer: the long-term-safe way to get the track out.
[[bin]]
name = "render-0010"
path = "src/main.rs"
