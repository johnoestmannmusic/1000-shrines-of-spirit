<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShrineGen — isometric shrine</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0d0c10; color: #c9c4d0;
    font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  body { overflow: hidden; }
  main { display: flex; gap: 16px; box-sizing: border-box;
    height: 100vh; height: 100dvh; padding: 16px; }
  /* The stage takes the leftover space and centres the square. The frame
     shrink-wraps the canvas so the overlay lines up with it exactly. */
  .stage { flex: 1 1 auto; min-width: 0; min-height: 0;
    display: flex; align-items: center; justify-content: center; }
  /* The frame is the square itself (not the canvas's 1200-pixel intrinsic
     size), so the overlay, the orbs' hit area and CyberPal's bar all fit it. */
  .frame { position: relative; display: block; width: min(100%, calc(100vh - 32px)); width: min(100%, calc(100dvh - 32px));
    aspect-ratio: 1; line-height: 0; background: #0d0c10; container-type: inline-size; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; border: 1px solid #2a2732; box-sizing: border-box;
    background: #0d0c10; cursor: pointer; }
  .overlay { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center;
    gap: 8px; text-align: center; background: rgba(13, 12, 16, 0.42);
    color: #d7d3de; cursor: pointer; user-select: none; transition: opacity 0.25s; }
  .overlay .icon { font-size: 3rem; line-height: 1; color: #96dcb4; }
  .overlay small { font-size: 0.8rem; color: #8a8596; }
  .frame.playing .overlay { opacity: 0; pointer-events: none; }
  /* CyberPal's insights: a cyberspace text box that rises from the bottom of
     the picture, types its line, then slides away. */
  .frame { overflow: hidden; }
  .insight { position: absolute; left: 3%; right: 3%; bottom: 3%; z-index: 1; line-height: 1.45;
    padding: 18px 20px 14px; color: #d8fbff; cursor: pointer;
    /* Scaled with the picture, so a line of INSIGHT_MAX characters always fits in two rows. */
    font: clamp(8px, 1.72cqw, 15px)/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background:
      repeating-linear-gradient(0deg, rgba(95, 247, 255, 0.05) 0 1px, transparent 1px 3px),
      linear-gradient(90deg, rgba(95, 247, 255, 0.04) 1px, transparent 1px) 0 0 / 14px 14px,
      linear-gradient(180deg, rgba(6, 12, 28, 0.9), rgba(10, 4, 24, 0.92));
    border: 1px solid rgba(95, 247, 255, 0.75);
    box-shadow: 0 0 14px rgba(95, 247, 255, 0.35), inset 0 0 18px rgba(255, 79, 216, 0.12);
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    text-shadow: 0 0 6px rgba(95, 247, 255, 0.55);
    transform: translateY(140%); opacity: 0; transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1), opacity 0.2s; }
  .insight.open { transform: translateY(0); opacity: 1; animation: glitch-in 0.32s steps(2) 1; }
  .insight .tag { position: absolute; top: 4px; left: 14px; font-size: 0.72em; letter-spacing: 0.22em; color: #ff4fd8;
    text-shadow: 0 0 6px rgba(255, 79, 216, 0.8); }
  .insight .tag::before { content: "["; color: #5ff7ff; margin-right: 2px; }
  .insight .tag::after { content: "]_"; color: #5ff7ff; margin-left: 2px; }
  .insight .portrait { display: none; }            /* CyberPal's face, coming later */
  .insight .line { margin: 6px 0 0; min-height: 3em; white-space: pre-wrap; padding-right: 1.2em; }
  .insight .line[data-cursor]::after { content: "█"; color: #5ff7ff; animation: blink 0.8s steps(1) infinite; }
  .insight .more { position: absolute; right: 18px; bottom: 6px; font-size: 0.7em; color: #ff4fd8; animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes glitch-in {
    0% { clip-path: polygon(0 40%, 100% 40%, 100% 60%, 0 60%); filter: hue-rotate(80deg); }
    50% { transform: translate(3px, 0); filter: hue-rotate(-60deg); }
    100% { transform: translate(0, 0); filter: none; }
  }
  body.learning .insight { display: none; }
  /* A small picture (phones): a tighter box and a slightly smaller floor, so
     a full insight still fits in two rows. */
  @container (max-width: 520px) {
    .insight { left: 2%; right: 2%; bottom: 2%; padding: 15px 10px 10px;
      font-size: clamp(7.5px, 1.72cqw, 15px); }
    .insight .tag { left: 10px; top: 3px; }
    .insight .line { padding-right: 0.8em; }
  }
  aside.info { flex: 0 0 300px; min-width: 0; max-height: 100%;
    display: flex; flex-direction: column; min-height: 0; }
  aside.info h2 { font-size: 0.8rem; font-weight: 400; letter-spacing: 0.12em;
    text-transform: uppercase; color: #8a8596; margin: 4px 0 8px; }
  aside.info h1 { font-size: 1.05rem; font-weight: 400; letter-spacing: 0.16em;
    text-transform: uppercase; color: #e6e2ec; margin: 2px 0 10px; }
  /* The recipe scrolls on its own so the buttons below it always fit. */
  aside.info pre { flex: 1 1 auto; min-height: 0; overflow: auto; }
  aside.info .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; flex: 0 0 auto; }
  aside.info .button { display: inline-block; padding: 6px 12px; font-family: inherit; line-height: 1.4; font-size: 0.82rem; letter-spacing: 0.04em;
    color: #d7f2e3; text-decoration: none; border: 1px solid #2f5a45; border-radius: 4px;
    background: #121a16; cursor: pointer; }
  aside.info .button:hover { border-color: #96dcb4; color: #ffffff; }
  aside.info .button[hidden] { display: none; }
  pre { margin: 0; padding: 12px; border: 1px solid #2a2732; background: #100f14;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #c2bfca; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* Learn: a full-screen explainer. The live shrine shrinks to a tile above
     the lesson list and keeps playing. */
  .learn { position: fixed; inset: 0; z-index: 2; display: none; background: #0d0c10;
    grid-template-columns: 272px minmax(0, 1fr); gap: 0; }
  body.learning .learn { display: grid; }
  body.learning aside.info { display: none; }
  body.learning .stage { position: fixed; z-index: 3; left: 16px; top: 16px; width: 240px; height: 240px; }
  body.learning .frame { width: 240px; }
  .learn nav { padding: 272px 16px 16px; border-right: 1px solid #2a2732; overflow: auto; }
  .learn nav h3 { font-size: 0.72rem; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase;
    color: #8a8596; margin: 14px 0 6px; }
  .learn nav button { display: block; width: 100%; text-align: left; font: inherit; font-size: 0.85rem;
    color: #c9c4d0; background: none; border: 0; border-radius: 4px; padding: 5px 8px; cursor: pointer; }
  .learn nav button:hover { background: #17151d; }
  .learn nav button[aria-current="true"] { background: #96dcb4; color: #0d0c10; }
  .learn article { overflow: auto; padding: 20px 28px 40px; max-width: 980px; }
  .learn .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .learn .top h2 { font-size: 1.15rem; font-weight: 400; letter-spacing: 0.08em; margin: 0; color: #e6e2ec; flex: 1 1 auto; }
  .learn .kicker { color: #8a8596; margin: 6px 0 14px; }
  .learn .diagram { width: 100%; height: 300px; display: block; border: 1px solid #2a2732; background: #100f14;
    image-rendering: auto; cursor: default; }
  .learn .live { color: #8a8596; font-size: 0.8rem; margin: 6px 0 0; min-height: 1.2em; }
  .learn h4 { font-size: 0.75rem; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase;
    color: #96dcb4; margin: 22px 0 8px; }
  .learn p { line-height: 1.6; margin: 0 0 10px; }
  .learn ul { margin: 0; padding-left: 1.2em; line-height: 1.6; }
  .learn li { margin-bottom: 6px; }
  .learn li::marker { color: #96dcb4; }
  .learn .solo[aria-pressed="true"] { background: #96dcb4; color: #0d0c10; border-color: #96dcb4; }
  .learn .button { display: inline-block; padding: 6px 12px; font: inherit; font-size: 0.82rem; letter-spacing: 0.04em;
    color: #d7f2e3; border: 1px solid #2f5a45; border-radius: 4px; background: #121a16; cursor: pointer; }
  .learn .button:hover { border-color: #96dcb4; color: #ffffff; }
  .learn .button[hidden] { display: none; }
  /* Narrow screens: the lessons become a strip under a small tile. */
  @media (max-width: 780px) {
    .learn { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    body.learning .stage { left: 16px; top: 12px; width: 96px; height: 96px; }
    body.learning .frame { width: 96px; }
    .learn nav { padding: 120px 16px 8px; border-right: 0; border-bottom: 1px solid #2a2732;
      display: flex; gap: 4px; overflow-x: auto; white-space: nowrap; }
    .learn nav h3 { display: none; }
    .learn nav button { width: auto; flex: 0 0 auto; }
    .learn article { padding: 16px; }
    .learn .diagram { height: 220px; }
  }
  /* Narrow screens: stack, and let the panel scroll below the shrine. */
  @media (max-width: 780px) {
    main { flex-direction: column; }
    .frame { width: min(100%, calc(60dvh - 32px)); }
    aside.info { flex: 0 0 auto; max-height: 34%; }
  }
</style>
</head>
<body>
<main>
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="screen" width="1200" height="1200" aria-label="Procedural isometric shrine"></canvas>
      <div class="insight" id="insight" role="status" aria-live="polite">
        <div class="tag"><span class="handle">CYBERPAL</span></div>
        <div class="portrait" aria-hidden="true"></div>
        <p class="line" id="insight-text"></p>
        <span class="more" aria-hidden="true">▼</span>
      </div>
      <div class="overlay" id="overlay">
        <span class="icon" id="icon">▶</span>
        <small id="hint">click to begin</small>
      </div>
    </div>
  </div>
  <aside class="info">
    <h1 id="track">ShrineGen</h1>
    <h2>Recipe</h2>
    <pre id="info">loading…</pre>
    <div class="actions">
      <button id="learn-open" class="button" type="button">Learn</button>
      <a id="download-wav" class="button" href="wav/track.wav" download hidden>Download WAV</a>
      <a class="button" href="https://github.com/johnoestmannmusic/1000-shrines-of-spirit" target="_blank" rel="noopener noreferrer">View Source</a>
    </div>
  </aside>
</main>
<section class="learn" id="learn" aria-label="How this piece is made">
  <nav id="lessons" aria-label="Lessons"></nav>
  <article>
    <div class="top">
      <h2 id="l-title">How this piece is made</h2>
      <button id="l-solo" class="button solo" type="button" aria-pressed="false" hidden>Hear it alone</button>
      <button id="learn-close" class="button" type="button">Close ✕</button>
    </div>
    <p class="kicker" id="l-kicker"></p>
    <canvas class="diagram" id="l-canvas" aria-label="A live diagram for this lesson"></canvas>
    <p class="live" id="l-live"></p>
    <h4>How it's made here</h4>
    <div id="l-how"></div>
    <h4>Recreate it</h4>
    <ul id="l-recreate"></ul>
  </article>
</section>
<script type="module">
  // Self-contained: no external scripts, styles, fonts or CDNs (HC010).
  const SAMPLE_RATE = 48000;
  const LOGICAL = 300;
  const stage = document.getElementById("stage");
  const frameEl = document.getElementById("frame");
  const canvas = document.getElementById("screen");
  const screen = canvas.getContext("2d");
  screen.imageSmoothingEnabled = false;
  const off = document.createElement("canvas");
  off.width = LOGICAL;
  off.height = LOGICAL;
  const offCtx = off.getContext("2d");
  const image = offCtx.createImageData(LOGICAL, LOGICAL);
  const overlay = document.getElementById("overlay");
  const icon = document.getElementById("icon");
  const hint = document.getElementById("hint");

  const wasmBytes = await fetch("shrine.wasm").then((r) => {
    if (!r.ok) throw new Error("shrine.wasm: " + r.status);
    return r.arrayBuffer();
  });
  const { instance } = await WebAssembly.instantiate(wasmBytes, {});
  const shr = instance.exports;

  // The recipe panel: the artifact bakes a human-readable card plus its build
  // date. A module built straight from the engine carries neither.
  (function showInfo() {
    const info = document.getElementById("info");
    // The heading is the track name the setup chose (falling back to the
    // product name when the artifact carries none).
    const track = document.getElementById("track");
    let trackName = "";
    if (typeof shr.shrine_name_ptr === "function" && shr.shrine_name_len() > 0) {
      trackName = new TextDecoder()
        .decode(new Uint8Array(shr.memory.buffer, shr.shrine_name_ptr(), shr.shrine_name_len()))
        .trim();
      if (trackName) track.textContent = trackName;
    }
    // Offer the bundled render. Candidates are tried in order and the button is
    // only revealed for one that really exists, so a statically hosted folder
    // works with no server to list the directory: the manifest first (written
    // beside the artifact), then a file named after the track, then track.wav.
    const wav = document.getElementById("download-wav");
    (async () => {
      const names = [];
      try {
        const list = await (await fetch("wav/manifest.json", { cache: "no-store" })).json();
        if (Array.isArray(list)) names.push(...list.filter((n) => typeof n === "string"));
      } catch {}
      if (trackName) names.push(trackName + ".wav");
      names.push("track.wav");
      for (const name of names) {
        try {
          const head = await fetch("wav/" + encodeURIComponent(name), { method: "HEAD" });
          if (head.ok) {
            wav.setAttribute("href", "wav/" + encodeURIComponent(name));
            wav.hidden = false;
            return;
          }
        } catch {}
      }
    })();
    if (typeof shr.shrine_info_ptr === "function") {
      const ptr = shr.shrine_info_ptr();
      const len = shr.shrine_info_len();
      info.textContent = new TextDecoder().decode(new Uint8Array(shr.memory.buffer, ptr, len));
    } else {
      info.textContent =
        "ShrineGen (development build)\n\nThis module was built from the engine directly, so it carries no baked recipe.\n\nUse the setup menu's Compile WASM action to emit a self-describing artifact.";
    }
  })();

  // Visual instance: mode 2 (no audio engine).
  const visual = shr.shrine_new(0, 0, 2);

  // The exported source is drawn into the sky, behind the shrine: the engine
  // leaves the sky unfilled, we paint the lit sky gradient ourselves, then draw
  // the frame over it so the shrine occludes the text. Reading starts at the
  // top of the file and the text moves upward, wrapping seamlessly.
  const overlayWord = typeof shr.shrine_code_overlay === "function" ? shr.shrine_code_overlay() : 0;
  const skyOverlay = (overlayWord & 1) !== 0;
  const overlayAlpha = Math.min(1, Math.max(0, ((overlayWord >> 8) & 0xff) / 100));
  const overlaySpeed = ((overlayWord >> 16) & 0xff) || 45;
  const overlayScale = ((overlayWord >>> 24) & 0xff) || 200;    // percent (100 = normal)
  const overlayAngle = typeof shr.shrine_code_angle === "function" ? shr.shrine_code_angle() : 0;
  const overlayOffset = typeof shr.shrine_code_offset === "function" ? shr.shrine_code_offset() : 0;
  // 0 static, 1 flat, 2 sphere. Bits 1-3 of the overlay word.
  const overlayPlane = (overlayWord >> 1) & 0x7;
  const cameraSpeed = typeof shr.shrine_camera_speed === "function" ? shr.shrine_camera_speed() : 0;
  const BASE_LINE_H = 13;                                       // px per source line at 100%
  const LINE_H = Math.max(8, Math.round((BASE_LINE_H * overlayScale) / 100));
  // Keep the reading rate steady: bigger text scrolls proportionally faster.
  const CODE_PX_PER_S = (20 + overlaySpeed * 3.8) * (overlayScale / 100);
  let codeLines = [];
  let codeScroll = 0;                             // px advanced through the file
  if (skyOverlay) {
    // Let the sky show through the canvas; the shrine stays opaque over it.
    if (typeof shr.shrine_set_sky_transparent === "function") {
      shr.shrine_set_sky_transparent(visual, 1);
    }
    fetch("shrine.rs")
      .then((r) => (r.ok ? r.text() : Promise.reject(new Error("no shrine.rs"))))
      .then((text) => { codeLines = text.split("\n"); })
      .catch(() => {});
  }

  // Paint the lit sky (as reported by the last engine frame) plus the scrolling
  // source. Kept inside the canvas: no DOM blend layers over a transparent
  // canvas, so nothing smears or leaves copies when the camera moves.
  function drawSkyAndSource(lit) {
    // Sky colours arrive packed 0xRRGGBB, top in the low 24 bits.
    const rgb = (v) => `rgb(${(v >> 16) & 0xff},${(v >> 8) & 0xff},${v & 0xff})`;
    const grad = screen.createLinearGradient(0, 0, 0, 1200);
    grad.addColorStop(0, rgb(Number(lit & 0xffffffn)));
    grad.addColorStop(1, rgb(Number((lit >> 24n) & 0xffffffn)));
    screen.fillStyle = grad;
    screen.fillRect(0, 0, 1200, 1200);
    if (codeLines.length === 0) return;
    const n = codeLines.length;
    const total = n * LINE_H;
    codeScroll = total > 0 ? codeScroll % total : 0;
    const first = Math.floor(codeScroll / LINE_H);
    const offset = codeScroll - first * LINE_H;
    // The drift is tilted by `overlayAngle` (positive leans left) and advances
    // along that tilted axis. Rotating about the centre means the drawn block
    // must be a square of `span` centred on the canvas, and the vertical shift
    // grows it again, or bare sky would show at the edges.
    const rad = (-overlayAngle * Math.PI) / 180;
    const shift = (overlayOffset / 100) * 1200;
    const span = 1200 * (Math.abs(Math.cos(rad)) + Math.abs(Math.sin(rad))) + 2 * Math.abs(shift);
    const from = 600 - span / 2;
    const kStart = Math.floor((from + offset) / LINE_H) - 1;
    const kEnd = Math.ceil((from + span + offset) / LINE_H) + 1;
    // The code plane: how the drift answers the camera orbit.
    //   static — pinned to the frame; the camera does not move it
    //   flat   — a flat band that slides across as the camera turns
    //   sphere — the same slide wrapped around the viewer, repeated so it is
    //            visible whichever way the camera points, and fading out
    //            towards the top where the seam sits out of frame
    const orbit = cameraSpeed === 0 || overlayPlane === 0 ? 0 : ((cameraSpeed * (clock / SAMPLE_RATE)) / 360) % 1;
    const period = overlayPlane === 2 ? 600 : 1200;
    const slide = overlayPlane === 0 ? 0 : -orbit * period;
    const repeats = overlayPlane === 0 ? [0] : [-1, 0, 1];

    screen.save();
    screen.globalCompositeOperation = "screen";
    screen.fillStyle = "#8fe0b0";
    screen.font = `${LINE_H - 2}px ui-monospace, SFMono-Regular, Menlo, monospace`;
    screen.textBaseline = "top";
    screen.translate(0, shift);
    screen.translate(600, 600);
    screen.rotate(rad);
    screen.translate(-600, -600);
    // One column, drawn exactly like the file: each line starts at the same x
    // and keeps its own line break, so the source stays human-readable. Raise
    // the text size or the vertical offset to cover more of the sky.
    for (let k = kStart; k < kEnd; k++) {
      const line = codeLines[(((first + k) % n) + n) % n];
      if (line.length === 0) continue;
      const y = k * LINE_H - offset;
      // On the sphere the code curls away from the viewer, so it dissolves as
      // it approaches the top of the sky — which is also where the last line
      // meets the first, keeping that seam out of sight.
      let alpha = overlayAlpha;
      if (overlayPlane === 2) {
        const lift = Math.min(1, Math.max(0, (y + 260) / 420));
        const sink = Math.min(1, Math.max(0, (1100 - y) / 320));
        alpha *= lift * sink;
        if (alpha <= 0.001) continue;
      }
      screen.globalAlpha = alpha;
      for (const rep of repeats) {
        screen.fillText(line, 8 + slide + rep * period, y);
      }
    }
    screen.restore();
  }

  let clock = 0;            // sample clock driving the visuals (frozen when paused)
  let clockBase = 0;        // last sample count reported by the worklet
  let clockBaseAt = 0;      // performance.now() when it arrived
  let haveClockBase = false;
  let audioStartedAt = 0;
  let playing = false;
  let audio = null;
  let node = null;
  let gain = null;
  let last = performance.now();

  // Learn mode's hooks (set up below).
  let learnFrame = null, learnState = null, learnLive = () => false;
  // The orbs' and CyberPal's hooks (set up below).
  let orbFrame = null, insightFrame = null;

  // Camera: eased toward the pointer, bounded.
  let camYaw = 0, camPitch = 0, targetYaw = 0, targetPitch = 0;
  // How quickly the camera eases, in seconds (time to cover about 63 % of
  // the way): brisk while following the pointer, slow and soft when it
  // drifts back to centre after the pointer leaves.
  const CAM_FOLLOW_S = 0.13;
  const CAM_RETURN_S = 1.6;
  // When the pointer comes (back) in, the camera starts as softly as it
  // returns and firms up to its brisk follow over this long.
  const CAM_ENGAGE_S = 1.2;
  let camReturning = false;
  let camEngage = 1;       // 0 just (re)entered … 1 fully following

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (playing) {
      clock = haveClockBase
        ? clockBase + ((now - clockBaseAt) * SAMPLE_RATE) / 1000
        : ((now - audioStartedAt) * SAMPLE_RATE) / 1000;
    }
    // Frame-rate independent easing; the return also starts gently.
    if (!camReturning) camEngage = Math.min(1, camEngage + dt / CAM_ENGAGE_S);
    const e = camEngage * camEngage * (3 - 2 * camEngage);
    const tau = camReturning ? CAM_RETURN_S : CAM_RETURN_S + (CAM_FOLLOW_S - CAM_RETURN_S) * e;
    const k = 1 - Math.exp(-dt / tau);
    camYaw += (targetYaw - camYaw) * k;
    camPitch += (targetPitch - camPitch) * k;
    if (typeof shr.shrine_set_camera === "function") {
      shr.shrine_set_camera(visual, camYaw, camPitch);
    }
    const ptr = shr.shrine_render_visual(visual, BigInt(Math.floor(clock)));
    const src = new Uint8ClampedArray(shr.memory.buffer, ptr, LOGICAL * LOGICAL * 4);
    image.data.set(src);
    offCtx.putImageData(image, 0, 0);
    if (skyOverlay) {
      codeScroll += CODE_PX_PER_S * dt;
      const lit = typeof shr.shrine_sky_colors === "function" ? shr.shrine_sky_colors(visual) : 0n;
      drawSkyAndSource(lit);
    } else {
      screen.clearRect(0, 0, 1200, 1200);
    }
    screen.drawImage(off, 0, 0, LOGICAL, LOGICAL, 0, 0, 1200, 1200);
    if (orbFrame) orbFrame(now, dt);
    if (insightFrame) insightFrame(now);
    if (learnFrame) learnFrame(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function setPlaying(on) {
    playing = on;
    frameEl.classList.toggle("playing", on);
    icon.textContent = on ? "❚❚" : "▶";
    hint.textContent = on ? "" : "click to pause";
  }

  async function startAudio() {
    audio = new AudioContext({ sampleRate: SAMPLE_RATE, latencyHint: "playback" });
    await audio.audioWorklet.addModule("shrine.worklet.js");
    node = new AudioWorkletNode(audio, "shrinegen", {
      numberOfInputs: 0,
      outputChannelCount: [2],
      processorOptions: { wasm: wasmBytes },
    });
    let readySeen = false;
    let readyResolve = null;
    node.port.onmessage = (e) => {
      if (e.data === "ready") {
        readySeen = true;
        if (readyResolve) readyResolve();
      } else if (typeof e.data === "number") {
        clockBase = e.data;
        clockBaseAt = performance.now();
        haveClockBase = true;
      } else if (e.data && e.data.state && learnState) {
        learnState(e.data.state);
      }
    };
    if (learnLive()) node.port.postMessage({ live: true });
    gain = new GainNode(audio, { gain: 1 });
    node.connect(gain).connect(audio.destination);
    await new Promise((resolve) => {
      readyResolve = resolve;
      if (readySeen) resolve();
    });
  }

  async function toggle() {
    try {
      if (!audio) {
        hint.textContent = "starting…";
        await startAudio();
        audioStartedAt = performance.now();
        clockBaseAt = performance.now();
        await audio.resume();
        setPlaying(true);
        return;
      }
      if (playing) {
        gain.gain.setTargetAtTime(0, audio.currentTime, 0.3);
        await new Promise((r) => setTimeout(r, 900));
        await audio.suspend();
        setPlaying(false);
      } else {
        gain.gain.cancelScheduledValues(audio.currentTime);
        gain.gain.setTargetAtTime(1, audio.currentTime, 0.3);
        await audio.resume();
        audioStartedAt = performance.now();
        clockBaseAt = performance.now();
        setPlaying(true);
      }
    } catch (e) {

    }

  // A step ring: `steps` cells around a circle, `lit` highlighted.
  function ring(g, cx, cy, r, steps, lit, col, name) {
    for (let i = 0; i < steps; i++) {
      const a0 = -Math.PI / 2 + (i / steps) * Math.PI * 2, a1 = a0 + (Math.PI * 2) / steps - 0.04;
      g.beginPath();
      g.arc(cx, cy, r, a0, a1);
      g.strokeStyle = i === lit ? col : C.faint;
      g.lineWidth = i === lit ? 9 : 6;
      g.stroke();
    }
    label(g, name, cx, cy, C.text, "center");
  }

  // A fragment strip: on/off sixteenths over two bars, the current one lit.
  function fragments(g, x, y, w, h, pattern, phase16, name) {

    for (let i = 0; i < cells; i++) {
      const p = (i % period) < on;
      g.fillStyle = p ? (i === phase16 % cells ? C.warm : C.accent) : (i === phase16 % cells ? C.dim : C.faint);
      g.globalAlpha = p ? 0.9 : 0.5;
      g.fillRect(x + i * cw + 1, y, cw - 2, h);

    g.globalAlpha = 1;
    for (let b = 0; b <= 2; b++) { g.fillStyle = C.dim; g.fillRect(x + b * 16 * cw - 1, y - 3, 1, h + 6); }
  }

  const titleOf = (l) => l.title;

  function buildNav() {
    lessonsEl.textContent = "";
    let group = "";
    LESSONS.forEach((l, i) => {
      if (l.group !== group) {
        group = l.group;
        const h = document.createElement("h3");
        h.textContent = group;
        lessonsEl.appendChild(h);
      }
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = titleOf(l);
      b.addEventListener("click", () => show(i));
      lessonsEl.appendChild(b);
    });
  }

  function setSolo(n) {
    soloOn = n;
    if (node) node.port.postMessage({ solo: n });
    lSolo.setAttribute("aria-pressed", n ? "true" : "false");
    lSolo.textContent = n ? "Back to the full mix" : "Hear it alone";
  }

  function show(i) {
    lesson = i;
    const l = LESSONS[i];
    [...lessonsEl.querySelectorAll("button")].forEach((b, k) => b.setAttribute("aria-current", k === i ? "true" : "false"));
    if (soloOn) setSolo(0);
    lTitle.textContent = titleOf(l);
    lKicker.textContent = l.kicker();
    lHow.innerHTML = l.how().filter(Boolean).map((p) => `<p>${p}</p>`).join("");
    lRecreate.innerHTML = l.recreate().map((r) => `<li>${r}</li>`).join("");
    lSolo.hidden = !l.solo || (l.title === "Drums" && !D.drums.on);
  }

  lSolo.addEventListener("click", async () => {
    const l = LESSONS[lesson];
    if (!l.solo) return;
    if (!playing) await toggle();
    setSolo(soloOn ? 0 : l.solo());
  });

  function describe() {
    if (typeof shr.shrine_learn_ptr !== "function") return null;
    const len = shr.shrine_learn_len(visual);
    const ptr = shr.shrine_learn_ptr(visual);
    return JSON.parse(new TextDecoder().decode(new Uint8Array(shr.memory.buffer, ptr, len)));
  }

  function openLearn() {
    learning = true;
    document.body.classList.add("learning");
    if (node) node.port.postMessage({ live: true });
    // CyberPal may have built the description already.
    if (D && !lessonsEl.children.length) {
      buildNav();
      show(lesson);
    }
    if (!D) {
      lTitle.textContent = "Preparing…";
      lKicker.textContent = "Working out how this piece is made (a moment).";
      // Let the page paint first: building the description takes a second.
      setTimeout(() => {
        try {
          D = describe();
        } catch (e) {
          D = null;
        }
        if (!D) {
          lTitle.textContent = "Not available";
          lKicker.textContent = "This build does not describe itself. Use the setup's Compile WASM to make one that does.";
          return;
        }
        buildNav();
        show(lesson);
      }, 30);
    }
  }

  function closeLearn() {
    learning = false;
    document.body.classList.remove("learning");
    if (soloOn) setSolo(0);
    if (node) node.port.postMessage({ live: false });
  }

  document.getElementById("learn-open").addEventListener("click", openLearn);
  document.getElementById("learn-close").addEventListener("click", closeLearn);
  window.addEventListener("keydown", (e) => {
    if (!learning) return;
    if (e.key === "Escape") closeLearn();
    if (D && (e.key === "ArrowDown" || e.key === "ArrowUp") && e.target === document.body) {
      e.preventDefault();
      show((lesson + (e.key === "ArrowDown" ? 1 : LESSONS.length - 1)) % LESSONS.length);
    }
  });

  // Called by the render loop each frame.
  learnFrame = () => {
    if (!learning || !D) return;
    const note = LESSONS[lesson].draw(fit());
    lLive.textContent = (note || "") + (soloOn && L ? ` · hearing ${D.solos[soloOn - 1].replace(/(\d)/, " $1").toLowerCase()} alone` : "");
  };
  learnState = (s) => { L = s; };
  learnLive = () => learning;
  // A link can open a lesson directly: #learn, or #learn-3 for the third.
  const wanted = /^#learn(?:-(\d+))?$/.exec(location.hash);
  if (wanted) {
    lesson = Math.min(LESSONS.length, Math.max(1, Number(wanted[1] || 1))) - 1;
    openLearn();
  }

  // ---------------------------------------------------------------- @ Orbs & CyberPal
  // Now and then a glowing @ orb surfaces on a tile of the shrine. Click it and
  // CyberPal, the page's digital guide, tells you one thing about how this
  // piece is made. Page UI only: nothing here touches the music or the picture.
  // Tweak these freely.
  const orbTest = new URLSearchParams(location.search).get("orbs") === "test";
  const ORB_EVERY_S = orbTest ? 1 : 6;     // how often an orb may appear
  const ORB_CHANCE = orbTest ? 1 : 0.4;    // the chance it does, each time
  const ORB_LIFE_S = 20;                   // how long an unclicked orb stays
  const ORB_MAX = 4;                       // orbs at once
  const ORB_RADIUS = 24;                   // in canvas pixels (1200 across)
  const INSIGHT_HOLD_S = 15;               // how long a typed insight stays up
  const INSIGHT_CPS = 40;                  // typing speed, characters per second
  const UI_SOUND_LEVEL = 0.05;             // loudness of the orbs' hover and click sounds (0 = silent)

  const orbs = [];       // { gx, gy, born, x, y, popped }
  let orbClock = 0;      // seconds of playback counted towards the next roll
  let hoverOrb = null;   // the orb under the pointer, if any
  const insightEl = document.getElementById("insight");
  const insightText = document.getElementById("insight-text");
  const GLYPHS = "@#%&*+=<>/\\|{}[]01";

  // Where a tile's top surface is on the 1200-pixel canvas now.
  function tileOnCanvas(gx, gy) {
    if (typeof shr.shrine_surface_point !== "function") return null;
    const p = new Float64Array(shr.memory.buffer, shr.shrine_surface_point(visual, gx, gy, BigInt(Math.floor(clock))), 3);
    return p[0] < 0 ? null : { x: p[0] * 4, y: p[1] * 4, level: p[2] };
  }

  function spawnOrb(now) {
    if (orbs.filter((o) => !o.popped).length >= ORB_MAX) return;
    // Mostly on the shrine itself, now and then out on the ground.
    const onShrine = Math.random() < 0.7;
    for (let tries = 0; tries < 24; tries++) {
      const gx = Math.floor(Math.random() * 24), gy = Math.floor(Math.random() * 24);
      if (orbs.some((o) => o.gx === gx && o.gy === gy)) continue;
      const p = tileOnCanvas(gx, gy);
      if (!p || p.x < 40 || p.x > 1160 || p.y < 60 || p.y > 1140) continue;
      if (onShrine && p.level === 0 && tries < 20) continue;
      orbs.push({ gx, gy, born: now, x: p.x, y: p.y, popped: 0, spin: Math.random() * 6 });
      return;
    }
  }

  function drawOrb(o, now) {
    const age = (now - o.born) / 1000;
    if (o.popped) {
      // A burst of glyphs, scattering and fading.
      const t = (now - o.popped) / 500;
      screen.save();
      screen.font = "bold 18px ui-monospace, SFMono-Regular, Menlo, monospace";
      screen.textAlign = "center"; screen.textBaseline = "middle";
      for (let k = 0; k < 10; k++) {
        const a = (k / 10) * Math.PI * 2 + o.spin;
        screen.globalAlpha = Math.max(0, 1 - t);
        screen.fillStyle = k % 2 ? "#ff4fd8" : "#5ff7ff";
        screen.fillText(GLYPHS[(k * 7 + o.gx) % GLYPHS.length], o.x + Math.cos(a) * t * 70, o.y - 26 + Math.sin(a) * t * 70);
      }
      screen.restore();
      return t < 1;
    }
    const fadeIn = Math.min(1, age / 0.4);
    const left = ORB_LIFE_S - age;
    // Flicker out over the last two seconds.
    const fadeOut = left > 2 ? 1 : Math.max(0, left / 2) * (Math.sin(now / 35) > -0.3 ? 1 : 0.25);
    const alpha = fadeIn * fadeOut;
    if (left <= 0) return false;
    const bob = Math.sin(age * 2.2 + o.spin) * 5;
    // Under the pointer it swells and flares, so it is plainly clickable.
    o.hover = (o.hover || 0) + ((o === hoverOrb ? 1 : 0) - (o.hover || 0)) * 0.25;
    const hv = o.hover;
    const cx = o.x, cy = o.y - 38 + bob, r = ORB_RADIUS * (1 + 0.18 * hv);
    screen.save();
    screen.globalAlpha = alpha;
    // Its tile, lit as a wireframe diamond, and a thin beam up to the orb.
    const pulse = 0.5 + 0.5 * Math.sin(now / 300 + o.spin);
    screen.strokeStyle = `rgba(95,247,255,${0.45 + 0.4 * pulse})`; screen.lineWidth = 1.5;
    screen.beginPath(); screen.moveTo(o.x, o.y - 12); screen.lineTo(o.x + 25, o.y); screen.lineTo(o.x, o.y + 12); screen.lineTo(o.x - 25, o.y); screen.closePath(); screen.stroke();
    screen.fillStyle = `rgba(95,247,255,${0.08 + 0.1 * pulse})`; screen.fill();
    const beam = screen.createLinearGradient(0, o.y, 0, cy);
    beam.addColorStop(0, "rgba(95,247,255,0.5)"); beam.addColorStop(1, "rgba(255,79,216,0)");
    screen.fillStyle = beam; screen.fillRect(o.x - 1, cy + r, 2, o.y - cy - r);
    // The halo and the glass body.
    let g = screen.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 2.4);
    g.addColorStop(0, `rgba(95,247,255,${0.35 + 0.45 * hv})`); g.addColorStop(0.5, `rgba(255,79,216,${0.12 + 0.25 * hv})`); g.addColorStop(1, "rgba(95,247,255,0)");
    screen.fillStyle = g; screen.beginPath(); screen.arc(cx, cy, r * (2.4 + 0.8 * hv), 0, Math.PI * 2); screen.fill();
    // A dark glass core, so the @ reads against it, rimmed in light.
    g = screen.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, "rgba(6,18,36,0.55)"); g.addColorStop(0.7, "rgba(20,70,110,0.35)"); g.addColorStop(1, "rgba(255,79,216,0.35)");
    screen.fillStyle = g; screen.beginPath(); screen.arc(cx, cy, r, 0, Math.PI * 2); screen.fill();
    // A small specular glint, top left.
    screen.fillStyle = "rgba(220,255,255,0.45)"; screen.beginPath(); screen.ellipse(cx - r * 0.45, cy - r * 0.5, r * 0.22, r * 0.12, -0.6, 0, Math.PI * 2); screen.fill();
    screen.strokeStyle = "rgba(95,247,255,0.85)"; screen.lineWidth = 1.5; screen.stroke();
    // A ring of scan dashes turning the other way.
    screen.setLineDash([3, 5]); screen.lineDashOffset = -now / 40;
    screen.strokeStyle = "rgba(255,79,216,0.6)"; screen.beginPath(); screen.arc(cx, cy, r + 6, 0, Math.PI * 2); screen.stroke();
    screen.setLineDash([]);
    if (hv > 0.02) {
      // A bright outer ring, pulsing outwards, and a prompt.
      const ping = (now / 700) % 1;
      screen.strokeStyle = `rgba(95,247,255,${hv * (1 - ping)})`; screen.lineWidth = 2;
      screen.beginPath(); screen.arc(cx, cy, r + 8 + ping * 18, 0, Math.PI * 2); screen.stroke();
      screen.font = "bold 13px ui-monospace, SFMono-Regular, Menlo, monospace";
      screen.textAlign = "center"; screen.textBaseline = "middle";
      screen.fillStyle = `rgba(255,79,216,${hv})`; screen.shadowColor = "rgba(255,79,216,0.9)"; screen.shadowBlur = 6;
      screen.fillText("[ CLICK ]", cx, cy - r - 22);
      screen.shadowBlur = 0;
    }
    // The @, spinning on its vertical axis, split into cyan and magenta.
    const spin = Math.cos(now / 900 + o.spin);
    screen.translate(cx, cy);
    screen.scale(0.35 + 0.65 * Math.abs(spin), 1);
    screen.font = "bold 32px ui-monospace, SFMono-Regular, Menlo, monospace";
    screen.textAlign = "center"; screen.textBaseline = "middle";
    screen.fillStyle = "rgba(255,79,216,0.75)"; screen.fillText("@", -2, 1);
    screen.fillStyle = "rgba(95,247,255,0.75)"; screen.fillText("@", 2, -1);
    screen.shadowColor = "rgba(95,247,255,0.9)"; screen.shadowBlur = 8;
    screen.fillStyle = spin < 0 ? "#bfefff" : "#ffffff"; screen.fillText("@", 0, 0);
    screen.restore();
    o.cx = cx; o.cy = cy;
    return true;
  }

  // Called by the render loop each frame, after the picture is drawn.
  orbFrame = (now, dt) => {
    if (playing && !learnLive()) {
      orbClock += dt;
      if (orbClock >= ORB_EVERY_S) {
        orbClock -= ORB_EVERY_S;
        if (Math.random() < ORB_CHANCE) spawnOrb(now);
      }
    }
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      if (!o.popped) {
        const p = tileOnCanvas(o.gx, o.gy);
        if (p) { o.x = p.x; o.y = p.y; }
      }
      if (learnLive() || !drawOrb(o, now)) orbs.splice(i, 1);
    }
  };

  // The orbs' feedback sounds: tiny synthesised blips mixed straight to the
  // output, panned to where the orb is. They never touch the music engine.
  function uiSound(kind, x) {
    if (!audio || audio.state !== "running" || UI_SOUND_LEVEL <= 0) return;
    const t = audio.currentTime;
    const out = new GainNode(audio, { gain: UI_SOUND_LEVEL });
    const pan = new StereoPannerNode(audio, { pan: Math.max(-1, Math.min(1, ((x || 600) / 1200) * 2 - 1)) * 0.6 });
    out.connect(pan).connect(audio.destination);
    const pip = (freq, to, at, len, peak) => {
      const o = new OscillatorNode(audio, { type: "sine", frequency: freq });
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + at + len * 0.6);
      const g = new GainNode(audio, { gain: 0 });
      g.gain.setValueAtTime(0, t + at);
      g.gain.linearRampToValueAtTime(peak, t + at + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + at + len);
      o.connect(g).connect(out);
      o.start(t + at);
      o.stop(t + at + len + 0.02);
    };
    if (kind === "hover") {
      // A soft rising blip.
      pip(1760, 2350, 0, 0.08, 0.5);
    } else {
      // Two quick pips a fifth apart, and a tiny bright tick.
      pip(1320, 0, 0, 0.09, 0.6);
      pip(1980, 0, 0.055, 0.12, 0.5);
      const n = Math.floor(audio.sampleRate * 0.015);
      const buf = new AudioBuffer({ length: n, sampleRate: audio.sampleRate });
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = new AudioBufferSourceNode(audio, { buffer: buf });
      const bp = new BiquadFilterNode(audio, { type: "bandpass", frequency: 6000, Q: 1.5 });
      const g = new GainNode(audio, { gain: 0.35 });
      src.connect(bp).connect(g).connect(out);
      src.start(t);
    }
    setTimeout(() => { out.disconnect(); pan.disconnect(); }, 600);
  }

  // Which orb (if any) is under a point of the page.
  function orbAt(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    const x = ((clientX - r.left) / r.width) * 1200, y = ((clientY - r.top) / r.height) * 1200;
    return orbs.find((o) => !o.popped && o.cx !== undefined && Math.hypot(x - o.cx, y - o.cy) < ORB_RADIUS * 1.8);
  }
  frameEl.addEventListener("mousemove", (e) => {
    const was = hoverOrb;
    hoverOrb = orbAt(e.clientX, e.clientY) || null;
    if (hoverOrb && hoverOrb !== was) uiSound("hover", hoverOrb.cx);
    canvas.style.cursor = hoverOrb ? "pointer" : "";
  });
  frameEl.addEventListener("mouseleave", () => { hoverOrb = null; });

  // ---------------- CyberPal's insights
  // Each is true for this piece (`when`) and filled with its own values.
  // Topics: the music, the sound design, and the picture.
  const s1 = (x, d = 1) => Number(x).toFixed(d).replace(/\.0+$/, "");
  const on = (D) => D.loops.filter((l) => l.on);
  const M = (D, ...ms) => ms.includes(D.mode.index);
  // Short and practical: each line teaches one thing you could rebuild
  // yourself, and fits the bar in two lines (at most INSIGHT_MAX characters).
  const INSIGHT_MAX = 122;
  const INSIGHTS = [
    // ---- The software
    ["music", () => true, () => "Plot twist: nothing here is recorded. I compute every sample live, 48,000 a second, and replay it exactly."],
    ["music", () => true, (D) => `This whole piece is a recipe of ${D.recipe.length} numbers: seeds plus every setting. Keep them and you can rebuild it, note for note.`],
    ["music", () => true, () => "House rule: seed every random choice from fixed numbers, never the clock. That's how a piece replays exactly."],
    ["music", () => true, () => "Secret: your system's sin() rounds differently from mine, so I build my own from + − × ÷ and √. Every chip agrees."],
    ["music", () => true, () => "The browser and the native build make the same audio, bit for bit. Every build hashes millions of samples to prove it."],
    ["music", () => true, () => "Under the hood: one WebAssembly file with zero imports. An AudioWorklet asks it for 128 samples at a time and plays them."],
    ["music", () => true, () => "The engine uses only Rust's standard library: no packages at all. The whole piece compiles from one readable source file."],
    ["music", () => true, () => "Rendering never depends on block size: 128 samples at a time or 4096, every event lands on its exact sample number."],
    ["music", (D) => D.start_s > 0, (D) => `This piece starts ${D.start_s} s in. I fast-forward the music exactly to that point, then fade in over a second and a half.`],
    ["music", () => true, () => "Old recipes still open: each one carries a version number, and missing settings fall back to their defaults."],
    ["music", () => true, () => "The music fades in over its first 10 seconds, so the first drone frame never starts with a jolt."],
    // ---- Form and timing
    ["music", () => true, () => "No written sections: seven slow LFOs of 41, 61, 97, 151, 233, 307 and 113 s automate the layers instead."],
    ["music", () => true, () => "Those LFO lengths are primes on purpose: with no shared factors, they would take days to line up the same way again."],
    ["music", () => true, (D) => `Drums run at ${D.bpm} BPM; every ambient layer moves at exactly half that, so the slow bed and the fast beat stay locked.`],
    ["music", (D) => D.drums.on, (D) => `Drum phrases are four bars (${s1(D.phrase_s, 1)} s). A slow energy LFO, plus a little chance, picks each phrase's section ahead of time.`],
    ["music", (D) => D.drums.on, () => "The first two phrases are always drum-free, and the third is hats only, so every piece opens as ambience before the beat."],
    // ---- Harmony
    ["music", () => true, (D) => `We're in ${D.key.name} ${D.scale.name}: ${D.scale.mood}. Every note I play is from it.`],

    ["music", (D) => M(D, 0, 1) && D.chords.length > 1, () => "Each chord change is a crossfade a whole bar long, blending the frozen spectra bin by bin, so there is never a seam."],
    ["music", (D) => M(D, 0, 1), () => "Later chords prefer strong degrees (4th, 5th, 6th) and never repeat the one before, so the harmony keeps moving."],
    ["music", (D) => M(D, 2), (D) => `2-step progression: ${D.garage.progression}. It changes every two bars on the downbeat, so the bass and pads always turn together.`],
    ["music", (D) => M(D, 2), () => "Garage progressions borrow chords from outside the key (a secondary dominant, a borrowed iv, ♭VII) to lift."],
    ["music", (D) => M(D, 2) && D.garage.lift !== "off", (D) => `Key lift (${D.garage.lift}): the whole loop steps up a whole tone for a while, then drops home. A classic menu-music move.`],
    ["music", (D) => M(D, 3) && D.micro.chords !== "slow", (D) => `My microsound chords change ${D.micro.chords}, crossing over in a single beat: small sounds, quick, regular turns.`],
    ["music", (D) => M(D, 3), () => "Microsound defaults to the minor pentatonic: five notes with no semitones between them, so no pip can ever clash."],
    // ---- The drone
    ["sound", (D) => !M(D, 3), () => "Drone recipe: play the chord on a three-operator FM synth, record about 8 s, then spectral-freeze the recording."],
    ["sound", (D) => !M(D, 3) && D.recipes[0] && D.recipes[0][0], (D) => `This chord's first FM voice: modulators at ×${s1(D.recipes[0][0].r2, 2)} and ×${s1(D.recipes[0][0].r3, 2)}, wired as ${D.recipes[0][0].stack ? "a stack (3 → 2 → 1)" : "a pair (2 and 3 into 1)"}.`],
    ["sound", (D) => !M(D, 3), () => "Near-whole-number FM ratios (½, 1, 2, 3, 4.003) keep the chord harmonic, with just a hint of shimmer from the odd one."],
    ["sound", (D) => M(D, 3), () => "Microsound drone: the same chord, but every FM index set to zero, so each note is a pure sine. Thin, glassy, still."],
    ["sound", () => true, (D) => `The freeze trick: keep each frequency bin's level, give it a new random phase every ${s1(D.hop_s * 1000, 0)} ms, and overlap the frames.`],
    ["sound", () => true, (D) => `Freeze window: ${D.fft_size} samples, about 0.68 s. Long windows smear the chord into a cloud with no attack left in it.`],
    ["sound", () => true, () => "Four squared-Hann frames a quarter apart sum to exactly 1.5, so the random-phase frames blend at a steady level."],
    ["sound", () => true, () => "Freeze the chord twice and pan one left, one right. Independent random phases make it wide, yet it never cancels in mono."],
    ["sound", () => true, (D) => `The drone's low-pass sweeps ${s1(D.drone_cutoff.min, 0)} Hz to ${s1((D.drone_cutoff.min * Math.pow(2, D.drone_cutoff.octaves)) / 1000, 1)} kHz, pushed by two LFOs that never agree.`],
    ["sound", () => true, (D) => `Below ${M(D, 3) ? 220 : 110} Hz the frozen spectrum is left empty: the low end belongs to the bass, so the two never fight.`],
    ["sound", (D) => D.drone_arc.cycle_s > 0, (D) => `The drone comes and goes on a ${D.drone_arc.cycle_s} s arc, in for ${D.drone_arc.hold_s} s, with slow raised-cosine fades at each end.`],
    ["sound", (D) => D.drone_rhythm, () => "Drone rhythm is on: seed 7 picks an amplitude LFO that pulses the frozen chord in time with the beat."],
    ["sound", (D) => M(D, 3) && D.micro.drone_fragments, (D) => `I gate the drone in strict rhythm: ${D.micro.drone_fragments[0]} sixteenths on, ${D.micro.drone_fragments[1]} off, 3 ms attack, 25 ms release, locked to the bar.`],
    ["sound", (D) => M(D, 3) && D.micro.shift !== "off" && D.micro.shift_figure, (D) => `Each drone fragment hops to the next step of ${D.micro.shift_figure.map((x) => (x > 0 ? "+" : "") + x).join(", ")} semitones, via a two-head delay-line pitch shifter.`],
    ["sound", (D) => M(D, 2), () => "Under 2-step chords my drone holds just an open fifth on the tonic, and ducks further when a chord rubs."],
    // ---- Glitches
    ["sound", () => true, (D) => `Two glitch loops of ${D.glitch[0].steps} and ${D.glitch[1].steps} steps run side by side. Co-prime lengths only realign every ${D.glitch[0].steps * D.glitch[1].steps} steps.`],
    ["sound", () => true, () => "My glitch palette: crushed FM blips, noise ticks, drone grains, bell pings, square-wave clicks, bit-crushed bursts."],
    ["sound", () => true, () => "Every few loops one glitch step mutates: new sound, rest, new pitch, or the loop rotates. Never quite repeating."],
    ["sound", () => true, () => "Try this: give each step its own threshold and gate it with a slow density LFO. The layers thin out and fill back in."],
    ["sound", () => true, () => "Stutter glitches use no samples: they grab a few ms of the drone itself and repeat it, so they always fit the chord."],
    ["sound", () => true, () => "A glitch step can ratchet: retrigger two to eight times within its slot, for those tiny buzzing rolls."],
    ["sound", () => true, (D) => `Glitch echo: ping-pong, ${s1(D.echo.delay_s * 1000, 0)} ms, ${s1(D.echo.feedback * 100, 0)} % feedback, with a low-pass in the loop so each bounce darkens.`],
    ["sound", (D) => M(D, 2), () => "In 2-step the glitch pitches keep to the key's root and fifth only, so they sit under any chord in the progression."],
    ["sound", (D) => M(D, 3), () => "In microsound, pings, blips and stutters last a quarter as long, and the glitch echo barely repeats."],
    // ---- Drums
    ["music", (D) => D.drums.on && M(D, 0, 1), (D) => `Break recipe: play 2 bars at ${s1(D.drums.source_bpm, 0)} BPM, cut into 32 slices, replay at ${D.bpm} BPM: ${s1(D.drums.semitones_up, 1)} semitones up, the jungle way.`],
    ["music", (D) => D.drums.on && M(D, 0, 1), () => "Each bar I swap a few slices: repeat, reverse, stutter or pitch down. A seed and the bar number pick the edits."],
    ["sound", (D) => D.drums.on && M(D, 0, 1), (D) => `The break goes through a sampler colour: saturation, sample-and-hold, ${D.drums.bits}-bit depth, a low-pass and a small room.`],
    ["sound", (D) => D.drums.on && M(D, 0, 1, 2), () => "Before sampling, the break is bussed: transient boost, drive and bus compression, like running it through hardware."],
    ["sound", (D) => D.drums.on, () => "Cymbal choke: each hat or ride stops the one before it, like a real drummer's hand. It keeps the top end tidy."],
    ["sound", (D) => D.drums.on, (D) => `Drum space: ${D.drums.space} — ${D.drums.space_blurb}. The kick always stays in the centre.`],
    ["music", (D) => D.drums.on && M(D, 0, 1), () => "Half-time sections play each slice at half speed across two steps: the classic drag, lower and lazier."],
    ["music", (D) => D.drums.on && M(D, 0, 1), () => "Hats-only sections glide a 5 kHz high-pass over the break, so only the cymbals remain before the full beat drops back in."],
    ["music", (D) => D.drums.on && M(D, 2), (D) => `2-step: kick on 1, a second kick skipping past beat 3, claps on 2 and 4, rimshots on the pushes, hats swung ${D.garage.swing} %.`],
    ["music", (D) => D.drums.on && M(D, 2), () => "Swing tip: echo by an even number of 16ths (here 6). An odd number flips each repeat to the other side of the swing."],
    ["music", (D) => D.drums.on && M(D, 2), () => "The garage breakdown filters the kick and low end away, so the claps and hats float on their own before the drop."],
    ["music", (D) => D.drums.on && M(D, 2), () => "Open hats land on the off-beat eighths; the closed ones shuffle between them. That off-beat open hat is the 2-step bounce."],
    ["music", (D) => D.drums.on && M(D, 3), () => "My micro pulse: 45–55 Hz sine kicks, clicks one to three samples long, 2–8 ms noise grains, dead straight on 16ths."],
    ["sound", (D) => D.drums.on && M(D, 3), () => "Microsound clicks skip the sampler chain: no saturation, no bit-crush, no room. Every transient stays razor sharp."],
    ["music", (D) => D.drums.on && M(D, 3) && D.micro.dropouts !== "off", () => "Those stumbles are edits: a step drops out, skips back to repeat the one before, or ratchets four times in a sixteenth."],
    ["sound", (D) => D.drums.on, (D) => `Today's kit: ${D.drums.kit} (${D.drums.blurb}). Every voice is synthesised; seed 5 tunes each one.`],
    ["sound", (D) => D.drums.on, () => "Making room: while the drums play, the drone dips about 5 dB, pumps a little on every hit and loses some of its top end."],
    // ---- Bass
    ["music", (D) => M(D, 0, 1), () => "Bass recipe: an FM bass plus a pure sine an octave below, low-passed near 300 Hz, gliding to each new chord root."],
    ["music", (D) => M(D, 0, 1), () => "A hair of detune between the FM bass and its sub makes them beat slowly against each other: movement with no LFO at all."],
    ["music", (D) => M(D, 2) && D.garage.bass === "rhythmic", () => "2-step bass: syncopated 16ths on root, octave and fifth, swung with the drums, sliding in a semitone under the next chord."],
    ["music", (D) => M(D, 2), () => "The 2-step bassline and stabs both duck under every kick, a built-in sidechain that keeps the low end punchy."],
    ["music", (D) => M(D, 3), () => "Microsound bass: one short sine on the chord root, on the off-beat eighths only, rocking against the sub kick."],
    ["music", () => true, (D) => `The chord roots I follow: ${D.chords.map((c) => NOTE[Math.round(c.bass) % 12]).join(", ")}. The bass always lands on the root, never a passing tone.`],
    // ---- Loops and melody
    ["sound", (D) => on(D).length > 1, (D) => `My pad loops: ${on(D).map((l) => `${l.design.name} (${l.beats})`).join(", ")} beats. No shared factor, so they keep drifting apart.`],
    ["sound", (D) => on(D).length > 0, () => "Each pad loop is a short recorded performance of the chord, crossfaded at its seam so you never hear the join."],
    ["sound", (D) => D.transpose !== 0, (D) => `The atmosphere loops are transposed ${D.transpose > 0 ? "+" : ""}${D.transpose} semitones against the drone.`],
    ["sound", (D) => M(D, 3), (D) => `Grain cloud (${D.micro.grains}): I replay 20–80 ms windowed slices of the last 1.5 s of pads, some an octave up or down.`],
    ["sound", (D) => M(D, 3), () => "Each pad loop has its own fragment rhythm too, started on its own beat, so the layers interlock instead of doubling up."],
    ["sound", (D) => M(D, 3) && D.micro.pips !== "off", () => "Hear the pips? Chord tones three or four octaves up, 5–40 ms sine blips, each pinned to its own spot in stereo."],
    ["sound", (D) => M(D, 3) && D.micro.pips !== "off", () => "Some pips come in pairs, a thirty-second apart on opposite sides: a tiny stereo ping-pong with no delay effect."],
    ["music", (D) => M(D, 2) && D.garage.stabs !== "off", (D) => `Stab recipe: short seventh chords on the off-beat pushes, voice-led so the top note steps, in a ${D.garage.tone} tone.`],
    ["sound", (D) => M(D, 2) && D.garage.stabs !== "off", () => "At every chord change the stab echo empties itself in 20 ms, so the old chord never rings over the new one."],
    ["sound", (D) => M(D, 2), () => "Just before each change the reverb send dips, so the old chord's tail fades before the new chord arrives."],
    // ---- Space and the mix
    ["sound", () => true, (D) => `My reverb: 8 delay lines feeding back into each other, falling 60 dB in ${s1(D.reverb.decay_s, 1)} s. Send to it; don't insert it.`],
    ["sound", () => true, () => "The reverb's delay lines have unrelated lengths, so their echoes never pile up on one pitch: no metallic ring."],
    ["sound", (D) => D.master.length > 0, (D) => `Master effects in the chain right now: ${D.master.join(", ")}.`],
    ["sound", () => true, () => "The mix ends in a gentle tanh soft clip, which rounds off peaks instead of cutting them, plus a DC blocker."],
    ["sound", () => true, () => "Soloing a layer in Learn changes only what you hear: the full mix keeps running underneath, sample for sample."],
    // ---- Weather and sound design
    ["sound", () => true, () => "The rain you hear is a wash: band-passed noise hiss over a low body, louder and darker as the rain thickens."],
    ["sound", () => true, () => "Thunder arrives after the flash, delayed by the strike's distance. Count the seconds and you know how far away it was."],
    ["sound", () => true, () => "The wind is filtered noise that swells with each gust, plus a whistle that only sings when a gust is strong."],
    ["visual", () => true, () => "All weather particles drift on one smooth sideways wind that turns round only every half-minute or more."],
    ["visual", () => true, () => "Rain streaks lean along their travel: across by the wind, down by their fall, so they point where they are going."],
    ["visual", (D) => D.biome.roofed, () => "There's a roof up there: rain hits the glass above you, and I low-pass the weather so it sounds properly indoors."],
    ["visual", (D) => !!D.wildlife, (D) => `Wildlife's on: ${D.wildlife}. Their calls thin out in storms and snow, as real ones would.`],
    // ---- The picture
    ["visual", () => true, () => "Pixel-art rule: draw at 300×300, scale ×4 with nearest-neighbour. Never smooth it, or the crisp pixels turn to mush."],
    ["visual", () => true, () => "Isometric maths: screen x = (gx − gy)·w/2, y = (gx + gy)·h/2 − height. Paint the cells back to front."],
    ["visual", () => true, () => "One grid cell is 12.5 art pixels wide, so 24 span the picture. Edges round in fixed point: 16 steps a pixel."],
    ["visual", () => true, (D) => `The shrine is a ${D.shrine.size}×${D.shrine.size} height map of solid columns, filled from the ground up, so no tile can ever float.`],
    ["visual", () => true, () => "Painter's order: columns sort by gx + gy, far to near. When the camera turns, they re-sort by their turned depth."],
    ["visual", () => true, (D) => `Biome: ${D.biome.name}, ${D.biome.blurb}. The seed picks the palette's hues within it.`],
    ["visual", () => true, () => "Palette trick: a handful of colour roles (sky, stone, foliage, water, accent), each a light, mid and dark shade."],
    ["visual", () => true, () => "Every surface is lit three ways: a key light, a soft fill from the sky, then the weather's own colour grade on top."],
    ["visual", () => true, (D) => `Weather: ${D.weather.name}, ${D.weather.blurb}. Same clock as the music.`],
    ["visual", () => true, () => "Snow doesn't just fall: a cover value slowly whitens the tops of the stones the longer it snows."],
    ["visual", () => true, () => "The plants grow from the seed: small stem and leaf shapes per biome, each swaying on its own phase with the wind."],
    ["visual", () => true, () => "Sync the visuals to the audio clock (samples played), never the frame timer. Then they can't drift apart."],
    ["visual", () => true, () => "Move your pointer: I shear x by depth and squash y a touch. A convincing camera move with no 3D maths at all."],
    ["visual", (D) => D.camera_speed !== 0, (D) => `The camera orbits at ${D.camera_speed}°/s: the grid turns about the shrine's centre, and the plants stay upright.`],
    ["visual", (D) => D.code.on, () => "That text in the sky? My own source code, scrolling behind the shrine. You're reading the piece while it plays."],
    ["visual", () => true, () => "These @ orbs sit on a tile's top surface, placed with the same projection the rain splashes use, so they ride the camera."],
  ];

  // Shuffled draws: a random line you haven't seen yet, remembered for this
  // tab's session (a reload continues the run). Once every line true for
  // this piece has been seen, the run starts over, never with the last one.
  const SEEN_KEY = "cyberpal-seen";
  let seen = new Set();
  try { seen = new Set(JSON.parse(sessionStorage.getItem(SEEN_KEY) || "[]")); } catch {}
  let lastShown = -1;
  function nextInsight() {
    const pool = INSIGHTS.map((ins, i) => [ins, i]).filter(([[, when, text]]) => {
      if (!D) return text.length === 0 && when.length === 0;
      try { return when(D); } catch { return false; }
    });
    let fresh = pool.filter(([, i]) => !seen.has(i));
    if (fresh.length === 0) {
      seen = new Set();
      fresh = pool.filter(([, i]) => i !== lastShown);
    }
    const [[, , text], i] = fresh[Math.floor(Math.random() * fresh.length)] || pool[0];
    seen.add(i);
    lastShown = i;
    try { sessionStorage.setItem(SEEN_KEY, JSON.stringify([...seen])); } catch {}
    try { return text(D); } catch { return "Signal lost. Catch another orb and I'll try again."; }
  }

  // The description is built once, in a quiet moment after play starts (it
  // takes about a second), and shared with Learn.
  function ensureDescription() {
    if (D || typeof shr.shrine_learn_ptr !== "function") return;
    try { D = describe(); } catch { D = null; }
  }

  // The bar: rises, types, holds, slides away.
  let typing = null;     // { text, shown, started }
  let holdTimer = 0;
  function showInsight() {
    ensureDescription();
    const text = nextInsight();
    clearTimeout(holdTimer);
    insightEl.classList.remove("open");
    void insightEl.offsetWidth;          // restart the rise and the glitch
    insightEl.classList.add("open");
    typing = { text, started: performance.now(), done: false };
  }
  function hideInsight() {
    clearTimeout(holdTimer);
    insightEl.classList.remove("open");
    typing = null;
  }
  function finishTyping() {
    if (!typing || typing.done) return;
    typing.done = true;
    insightText.textContent = typing.text;
    insightText.dataset.cursor = "1";
    holdTimer = setTimeout(hideInsight, INSIGHT_HOLD_S * 1000);
  }
  // The typewriter, driven by the render loop: a few characters ahead still
  // "decoding" from random glyphs before they settle.
  insightFrame = (now) => {
    if (!typing || typing.done) return;
    const n = Math.floor(((now - typing.started) / 1000) * INSIGHT_CPS);
    if (n >= typing.text.length) return finishTyping();
    let noise = "";
    for (let k = 0; k < 2 && n + k < typing.text.length; k++) noise += typing.text[n + k] === " " ? " " : GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
    insightText.textContent = typing.text.slice(0, n) + noise;
    insightText.dataset.cursor = "1";
  };
  insightEl.addEventListener("click", (e) => {
    e.stopPropagation();
    if (typing && !typing.done) finishTyping();
    else hideInsight();
  });

  // A click on an orb pops it and calls CyberPal. Anywhere else closes an open
  // insight, or (with none open) plays or pauses.
  function onStageClick(e) {
    const o = orbAt(e.clientX, e.clientY);
    if (!o && insightEl.classList.contains("open")) {
      hideInsight();
      return;
    }
    if (o) {
      uiSound("pop", o.cx);
      o.popped = performance.now();
      showInsight();
      return;
    }
    toggle();
  }
  // Build the description in a quiet moment once the music is going.
  const idle = window.requestIdleCallback || ((f) => setTimeout(f, 1500));
  const warm = setInterval(() => { if (playing) { clearInterval(warm); idle(() => ensureDescription()); } }, 2000);
  if (orbTest) {
    window.shrineOrbs = () => orbs.map((o) => ({ x: o.cx, y: o.cy, popped: !!o.popped }));
    window.shrineDraw = (n) => { ensureDescription(); return Array.from({ length: n }, () => nextInsight()); };
    // Every line true for this piece: its length, and how many rows it takes in the bar.
    window.shrineInsightRows = () => {
      ensureDescription();
      insightEl.classList.add("open");
      const lh = parseFloat(getComputedStyle(insightText).lineHeight);
      const out = INSIGHTS.filter(([, when]) => { try { return when(D); } catch { return false; } }).map(([, , text]) => {
        const t = text(D);
        insightText.textContent = t;
        insightText.dataset.cursor = "1";
        return { len: t.length, rows: Math.round(insightText.scrollHeight / lh), t };
      });
      insightEl.classList.remove("open");
      return out;
    };
  }

  stage.addEventListener("click", onStageClick);

  function aim(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    // Inverted: the view follows the pointer (up tilts the camera up).
    targetYaw = -Math.max(-1, Math.min(1, ((clientX - r.left) / r.width) * 2 - 1));
    targetPitch = -Math.max(-1, Math.min(1, ((clientY - r.top) / r.height) * 2 - 1));
  }
  // The camera follows the pointer only over the square visual itself (the
  // frame shrink-wraps the canvas), and eases back to centre when it leaves.
  const recentre = () => { targetYaw = 0; targetPitch = 0; camReturning = true; };
  // Coming back in eases the follow up from soft to brisk.
  const engage = () => { camReturning = false; camEngage = 0; };
  frameEl.addEventListener("mouseenter", engage);
  frameEl.addEventListener("touchstart", engage, { passive: true });
  frameEl.addEventListener("mousemove", (e) => { camReturning = false; aim(e.clientX, e.clientY); });
  frameEl.addEventListener("mouseleave", recentre);
  frameEl.addEventListener("touchend", recentre);
  frameEl.addEventListener("touchmove", (e) => {
    const t = e.touches[0];
    camReturning = false;
    if (t) aim(t.clientX, t.clientY);
  }, { passive: true });
</script>
</body>
</html>
