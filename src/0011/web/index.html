<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0011</title>
<style>
  :root {
    --bg: #f4f3f0;
    --fg: #1c1c1a;
    --muted: #77756f;
    --line: #c9c6bf;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e0e0d; --fg: #e9e7e2; --muted: #8a877f; --line: #34332f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    padding: 16px;
  }
  main { width: min(28rem, 100%); }
  h1 { font-size: 3rem; font-weight: 400; letter-spacing: 0.08em; margin: 0 0 0.25rem; }
  p { color: var(--muted); margin: 0 0 2rem; }
  button {
    font: inherit;
    color: var(--fg);
    background: none;
    border: 1px solid var(--line);
    padding: 0.7rem 1.6rem;
    cursor: pointer;
    min-width: 9rem;
  }
  button:hover:not(:disabled) { border-color: var(--fg); }
  button:disabled { color: var(--muted); cursor: wait; }
  #status { margin-top: 1.2rem; font-size: 0.85rem; min-height: 1.5em; }
  #seeds { margin-top: 2.5rem; font-size: 0.8rem; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>0011</h1>
  <p>An endless glitch ambient piece, generated live by the WASM build of a Rust program.</p>
  <button id="play">Play</button>
  <div id="status"></div>
  <div id="seeds"></div>
</main>
<script type="module">
  // Canonical seeds, the same as DEFAULT_SEEDS in src/lib.rs.
  // Override with ?s1=…&s2=…&s3=…&s4=… (decimal or 0x hex) for alternate renditions.
  // Seed 5 shapes the drum kit. Settings: ?scale=1-12 (1 = Lydian), ?chords=1-4, ?pace=half|jungle,
  // ?kit=1-10 (1 Sub & clicks, 2 Micro blips, 3 Glass pings, 4 Data dust, 5 Pulse code, 6 Acoustic,
  //  7 FM metal, 8 Modal, 9 Digital crush, 10 Noise sculpture, 11 Off), ?space=centred|wide|tape (default wide),
  // ?bpm=70-180 (the drum tempo; ambient layers move at half, default 168),
  // ?loop1 / ?loop2: 0 or none = off; 1..12 = sustained timbres (1 Choir, 2 Glass, 3 Fantasia,
  //  4 Wave sequence, 5 Breath, 6 Whisper, 7 Wind, 8 Shimmer, 9 Stream, 10 Aurora, 11 Haze, 12 Off);
  //  or fire / water / stones / wood for an event grid; or E + 16 hex digits for a custom grid.
  //  defaults 1 and 2; seed 6, ?s6=…, shapes the sustained ones).
  // ?dronecycle=0-3600 and ?dronehold=0-3600 (seconds): the drone swells in for dronehold seconds
  //  of every dronecycle, then leaves; 0 = always on (default).
  // ?key=seed|C|C#|D|…|B: fix the root note, or let seed 1 pick it (default).
  // ?transpose=-12..12: shift the atmosphere loops relative to the chord (0 = match, default).
  const DEFAULT_SEEDS = ["1000", "9", "1009", "2026", "168", "11"];
  const num = (k, d, lo, hi) => {
    const v = parseInt(params.get(k) ?? "", 10);
    return Number.isFinite(v) && v >= lo && v <= hi ? v : d;
  };
  const params = new URLSearchParams(location.search);
  // An atmosphere layer, as { kind, lo, hi }: kind 0 = sustained timbre index, 1 = event grid.
  const GRIDS = { fire: "808000000202eeee", water: "ffff000011110000", stones: "00000000aaaa1040", wood: "0000aaaa02020000" };
  const loopArg = (k, d) => {
    const v = (params.get(k) ?? "").trim().toLowerCase();
    if (v in GRIDS) {
      const bits = BigInt("0x" + GRIDS[v]);
      return { kind: 1, lo: Number(bits & 0xffffffffn), hi: Number(bits >> 32n) };
    }
    if (v.startsWith("e") && v.length === 17) {
      try {
        const bits = BigInt("0x" + v.slice(1));
        return { kind: 1, lo: Number(bits & 0xffffffffn), hi: Number(bits >> 32n) };
      } catch {}
    }
    let n;
    if (v === "0" || v === "none" || v === "off" || v === "") n = 11;
    else {
      const p = parseInt(v, 10);
      n = Number.isFinite(p) && p >= 1 && p <= 12 ? p - 1 : d;
    }
    return { kind: 0, lo: n, hi: 0 };
  };
  const NOTES = { c: 1, "c#": 2, cs: 2, d: 3, "d#": 4, ds: 4, e: 5, f: 6, "f#": 7, fs: 7, g: 8, "g#": 9, gs: 9, a: 10, "a#": 11, as: 11, b: 12 };
  const keyArg = () => {
    const v = (params.get("key") ?? "").trim().toLowerCase();
    return v === "" || v === "seed" || v === "auto" || v === "0" ? 0 : NOTES[v] ?? 0;
  };
  const seeds = DEFAULT_SEEDS.map((d, i) => {
    const v = params.get(`s${i + 1}`);
    try {
      return v === null ? d : BigInt.asUintN(64, BigInt(v)).toString();
    } catch {
      return d;
    }
  });
  const settings = {
    scale: num("scale", 1, 1, 12) - 1,
    chords: num("chords", 3, 1, 4),
    pace: params.get("pace") === "jungle" ? 1 : 0,
    kit: num("kit", 1, 1, 11) - 1,
    space: { centred: 0, tape: 2 }[params.get("space")] ?? 1,
    bpm: num("bpm", 168, 70, 180),
    loop1: loopArg("loop1", 0),
    loop2: loopArg("loop2", 1),
    droneCycle: num("dronecycle", 0, 0, 3600),
    droneHold: num("dronehold", 0, 0, 3600),
    key: keyArg(),
    transpose: num("transpose", 0, -12, 12),
  };
  const def = (l, i) => l.kind === 0 && l.lo === i && l.hi === 0;
  const custom = seeds.some((s, i) => s !== DEFAULT_SEEDS[i]) || settings.scale !== 0 || settings.chords !== 3 || settings.pace !== 0 || settings.kit !== 0 || settings.space !== 1 || settings.bpm !== 168 || !def(settings.loop1, 0) || !def(settings.loop2, 1) || settings.droneCycle !== 0 || settings.droneHold !== 0 || settings.key !== 0 || settings.transpose !== 0;
  document.querySelector("#seeds").textContent =
    `seeds ${seeds.join(" · ")}${custom ? " (alternate rendition)" : ""}`;

  const button = document.querySelector("#play");
  const status = document.querySelector("#status");
  let ctx = null;
  let gain = null;
  let playing = false;

  async function start() {
    button.disabled = true;
    status.textContent = "Freezing the chord…";
    ctx = new AudioContext({ sampleRate: 48000, latencyHint: "playback" });
    if (ctx.sampleRate !== 48000) {
      status.textContent = `Note: browser is running at ${ctx.sampleRate} Hz and will resample.`;
    }
    const [wasm] = await Promise.all([
      fetch("track.wasm").then((r) => {
        if (!r.ok) throw new Error(`track.wasm: ${r.status}`);
        return r.arrayBuffer();
      }),
      ctx.audioWorklet.addModule("worklet.js"),
    ]);
    const node = new AudioWorkletNode(ctx, "track-0011", {
      numberOfInputs: 0,
      outputChannelCount: [2],
      processorOptions: { wasm, seeds, settings },
    });
    await new Promise((resolve) => (node.port.onmessage = resolve));
    gain = new GainNode(ctx, { gain: 1 });
    node.connect(gain).connect(ctx.destination);
  }

  button.addEventListener("click", async () => {
    try {
      if (!ctx) {
        await start();
      } else if (playing) {
        // Fade, then suspend: the piece pauses where it is and resumes there.
        gain.gain.setTargetAtTime(0, ctx.currentTime, 0.4);
        await new Promise((r) => setTimeout(r, 1500));
        await ctx.suspend();
        playing = false;
        button.textContent = "Play";
        return;
      } else {
        gain.gain.cancelScheduledValues(ctx.currentTime);
        gain.gain.setTargetAtTime(1, ctx.currentTime, 0.4);
        await ctx.resume();
      }
      playing = true;
      button.textContent = "Pause";
      if (!status.textContent.startsWith("Note")) status.textContent = "";
    } catch (e) {
      status.textContent = `Could not start audio: ${e.message}`;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
