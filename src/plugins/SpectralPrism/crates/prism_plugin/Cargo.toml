[package]
name = "prism_plugin"
version.workspace = true
edition.workspace = true

[lib]
# cdylib for the VST3/CLAP bundle, lib for the standalone binary target.
crate-type = ["cdylib", "lib"]

[[bin]]
name = "prism_plugin_standalone"
path = "src/main.rs"

[dependencies]
prism_dsp = { path = "../prism_dsp" }
nih_plug = { workspace = true, features = ["standalone"] }
nih_plug_egui = { workspace = true }
arc-swap = "1"
rfd = "0.15"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
